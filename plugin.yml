name: ChatPlugin
version: 1.0
main: com.example.chatplugin.ChatPlugin
api-version: 1.16
softdepend: [PlaceholderAPI, Vault] # Added Vault as it's used in placeholders
commands:
  cpreload:
    description: Reloads the ChatPlugin configuration.
    usage: /cpreload
    permission: chatplugin.reload
permissions:
  chatplugin.reload:
    description: Allows reloading the ChatPlugin configuration.
    default: op
  chatplugin.notifyblockedword:
    description: Notifies user when a player uses a blocked word.
    default: op
