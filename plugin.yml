name: ChatPlugin
version: 1.0
main: com.example.chatplugin.ChatPlugin
api-version: 1.16
softdepend: [PlaceholderAPI, Vault]
commands:
  cpreload:
    description: Reloads the ChatPlugin configuration.
    usage: /cpreload
    permission: chatplugin.reload
permissions:
  chatplugin.reload:
    description: Allows reloading the ChatPlugin configuration.
    default: op
  chatplugin.notifyblockedword:
    description: Notifies staff when a player uses a blocked word or sends a link/IP. # Updated description
    default: op
  chatplugin.globalchat: # New permission
    description: Allows using the global chat prefix to send messages to everyone.
    default: true 
  chatplugin.localchat: # New permission
    description: Allows using local chat.
    default: true
  chatplugin.bypass.antispam: # New permission
    description: Allows bypassing the anti-spam filter.
    default: op
  chatplugin.bypass.blockedwords: # New permission
    description: Allows bypassing the blocked words filter.
    default: op
  chatplugin.bypass.iplinkcheck: # New permission
    description: Allows bypassing the IP address and link filter.
    default: op
