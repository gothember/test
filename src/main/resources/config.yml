# Configuration for ChatPlugin

# Local chat settings
local-chat:
  radius: 100

# Global chat settings
global-chat:
  prefix: "!"

# Message format settings
format:
  local: "&7[Local] [%vault_prefix%&r&7%player%&r&7%vault_suffix%&r&7] %message%"
  global: "&e[Global] [%vault_prefix%&r&e%player%&r&e%vault_suffix%&r&e] %message%"

# Anti-spam settings
anti-spam:
  enabled: true
  message-limit: 3
  time-period-seconds: 5
  cooldown-seconds: 10
  spam-warning-message: "&cPlease don't spam! Wait %cooldown% seconds."
  cooldown-over-message: "&aYou can chat again."

# Blocked words filter
blocked-words:
  enabled: true
  list:
    - "exampleword1"
    - "badword2"
  player-warning-message: "&cYou used a blocked word! Please be respectful."
  admin-notification-message: "&c[Alert] Player %player% tried to use a blocked word: %word%"

# Link and IP address filter
link-ip-filter:
  enabled: true
  ip-regex: "(?:[0-9]{1,3}\\.){3}[0-9]{1,3}"
  link-regex: "([a-zA-Z0-9]+(-[a-zA-Z0-9]+)*\\.)+[a-zA-Z]{2,}(:[0-9]{1,5})?(/[^ \\s]*)?"
  allowed-domains:
    - "mycoolserver.com"
    - "another-allowed-site.net"
  player-warning-message: "&cPlease do not send links or IP addresses in chat."
  admin-notification-message: "&c[Alert] Player %player% tried to send a(n) %type%: %content%"

# Player Mention settings
player-mentions:
  enabled: true
  # The prefix to add before a mentioned player's name (e.g., @PlayerName)
  mention-prefix: "@"
  # The HEX color to apply to the mentioned player's name and prefix (e.g., "&#FFD700" for gold)
  # Ensure this is a valid HEX color format that ChatFormatter can parse.
  mention-hex-color: "&#DAA520" # Example: Luminous Vivid Amber
  # If true, only add prefix/color if player is online. If false, always try to format known player names.
  require-player-online: true
